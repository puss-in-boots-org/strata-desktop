[package]
name = "strata-desktop"
version = "0.2.0"
description = "Strata's desktop app: see which apps use your disk, and where"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Szabó Balázs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
# App icons for the UI (both already in Tauri's dependency tree).
png = "0.18"
base64 = "0.22"
# The scanner and attribution engine, from the Strata repo.
strata-core = { git = "https://github.com/balong2000/strata", rev = "9ddacf60272e163c140f2b63737000f61ebeebcd" }

[features]
# Serve the front end from inside the exe (what release builds need).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "strata-desktop"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
