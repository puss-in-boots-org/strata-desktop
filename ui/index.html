<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Strata</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="mark"><i></i><i></i><i></i><i></i></div>
        <span>Strata</span>
      </div>
      <button class="search" id="btn-search" title="Search (Ctrl+K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="scan-state" class="scan-state"></div>
        <div class="foot-row">
          <button class="ghost" id="btn-rescan" title="Rescan (Ctrl+R)">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>Rescan
          </button>
          <button class="ghost icon" id="btn-theme" title="Light / dark theme">
            <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="tip" id="tip"></div>

  <div class="palette-backdrop" id="palette" hidden>
    <div class="palette" role="dialog" aria-label="Search">
      <input id="palette-input" placeholder="Search apps, games, folders and commands…" spellcheck="false" autocomplete="off">
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>Enter</kbd> open <kbd>Esc</kbd> close</div>
    </div>
  </div>

  <div class="drop-overlay" id="drop"><div>Drop it to see what it belongs to</div></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
